
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <link rel="icon" href="assets/produtos/logo-gorde.jpg">

  <title>Admin | Chopperia Gorde</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="admin-body">

  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">D</span>
      <span>
        <b>ELIVERY GORDE</b>
        <small>PAINEL ADMINISTRATIVO</small>
      </span>
    </a>

    <a class="admin-link" href="index.html">
      ← Voltar ao cardápio
    </a>
  </header>

  <main class="admin-container">

    <!-- LOGIN -->
    <section id="loginPanel" class="admin-panel narrow">
      <span class="eyebrow">ACESSO RESTRITO</span>
      <h1>Entrar no painel</h1>

      <form id="loginForm">
        <label>
          E-mail
          <input
            id="email"
            type="email"
            required
            autocomplete="username"
            placeholder="seu@email.com"
          >
        </label>

        <label>
          Senha
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="Digite sua senha"
          >
        </label>

        <button class="primary full" type="submit">
          ENTRAR
        </button>
      </form>

      <p class="muted">
        APENAS COLABORADORES DA CHOPPERIA GORDE.
      </p>
    </section>

    <!-- PAINEL ADMINISTRATIVO -->
    <section id="dashboard" hidden>

      <div class="section-heading">
        <div>
          <span class="eyebrow">GERENCIE SUA LOJA</span>
          <h1>Painel administrativo</h1>
        </div>

        <button id="logout" class="secondary" type="button">
          SAIR
        </button>
      </div>

      <!-- ABAS -->
      <nav class="admin-tabs">
        <button
          type="button"
          class="admin-tab active"
          data-tab="products"
        >
          PRODUTOS
        </button>

        <button
          type="button"
          class="admin-tab"
          data-tab="coupons"
        >
          CUPONS
        </button>
      </nav>

      <!-- ABA PRODUTOS -->
      <div id="productsSection" class="admin-grid">

        <form id="productForm" class="admin-panel">
          <h2 id="formTitle">Adicionar produto</h2>

          <input id="productId" type="hidden">

          <label>
            Nome do produto
            <input
              id="pName"
              type="text"
              required
              placeholder="Ex.: Gin com energético"
            >
          </label>

          <label>
            Categoria
            <input
              id="pCategory"
              type="text"
              required
              placeholder="Ex.: Gin, Whisky, Cervejas"
            >
          </label>

          <label>
            Preço (R$)
            <input
              id="pPrice"
              type="number"
              min="0.01"
              step="0.01"
              required
              placeholder="0.00"
            >
          </label>

          <label>
            Descrição
            <textarea
              id="pDescription"
              placeholder="Descrição do produto"
            ></textarea>
          </label>

          <label>
            URL da foto (opcional)
            <input
              id="pImage"
              type="url"
              placeholder="https://..."
            >
          </label>

          <label class="check-label">
            <input id="pAvailable" type="checkbox" checked>
            Produto disponível
          </label>

          <div class="form-actions">
            <button class="primary" type="submit">
              SALVAR PRODUTO
            </button>

            <button
              class="secondary"
              type="button"
              id="clearForm"
            >
              LIMPAR
            </button>
          </div>
        </form>

        <section class="admin-panel products-panel">
          <h2>Produtos cadastrados</h2>

          <label class="category-filter">
            Filtrar produtos por categoria
            <select id="categoryFilter">
              <option value="all">Todas as categorias</option>
            </select>
          </label>

          <div id="adminProducts">
            <p class="muted">Carregando produtos...</p>
          </div>
        </section>

      </div>

      <!-- ABA CUPONS -->
      <section id="couponsSection" class="admin-grid" hidden>

        <form id="couponForm" class="admin-panel">
          <h2 id="couponFormTitle">Criar cupom</h2>

          <input id="couponId" type="hidden">

          <label>
            Código do cupom
            <input
              id="cCode"
              type="text"
              required
              maxlength="30"
              placeholder="Ex.: GORDE10"
            >
          </label>

          <label>
            Nome do influenciador
            <input
              id="cInfluencer"
              type="text"
              required
              placeholder="Nome do influenciador"
            >
          </label>

          <label>
            Tipo de desconto
            <select id="cDiscountType">
              <option value="percentage">Porcentagem (%)</option>
              <option value="fixed">Valor fixo (R$)</option>
            </select>
          </label>

          <label>
            Desconto
            <input
              id="cDiscountValue"
              type="number"
              min="0.01"
              step="0.01"
              value="10"
              required
            >
          </label>

          <label>
            Comissão do influenciador (%)
            <input
              id="cCommission"
              type="number"
              min="0"
              max="100"
              step="0.01"
              value="20"
              required
            >
          </label>

          <label>
            Pedido mínimo (R$)
            <input
              id="cMinOrder"
              type="number"
              min="0"
              step="0.01"
              value="30"
              required
            >
          </label>

          <label>
            Desconto máximo (R$) — opcional
            <input
              id="cMaxDiscount"
              type="number"
              min="0.01"
              step="0.01"
              placeholder="Sem limite"
            >
          </label>

          <label>
            Limite de utilizações — opcional
            <input
              id="cUsageLimit"
              type="number"
              min="1"
              step="1"
              placeholder="Ilimitado"
            >
          </label>

          <label>
            Validade — opcional
            <input id="cExpiresAt" type="datetime-local">
          </label>

          <label class="check-label">
            <input id="cActive" type="checkbox" checked>
            Cupom ativo
          </label>

          <div class="form-actions">
            <button class="primary" type="submit">
              SALVAR CUPOM
            </button>

            <button
              class="secondary"
              type="button"
              id="clearCouponForm"
            >
              LIMPAR
            </button>
          </div>
        </form>

        <section class="admin-panel products-panel">
          <h2>Cupons cadastrados</h2>

          <div id="adminCoupons">
            <p class="muted">Carregando cupons...</p>
          </div>
        </section>

      </section>

    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
  

</body>
</html>
